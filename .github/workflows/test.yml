name: Run Tests and Coverage

on:
  pull_request:
    branches: [ "main", "merged-tests" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install uv
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. Install project dependencies
      - name: Install dependencies with uv
        run: uv sync

      # 5. Run tests with coverage
      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: |
          # Mock CONFIG in record modal to prevent AttributeError
          uv run pytest \
            --cov=bagels \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --disable-warnings \
            tests/utils/test_validation.py \
            tests/test_config.py \
            tests/components/modules/test_incomemode.py \
            tests/managers/test_person.py \
            tests/modules/test_people.py

      # 6. Ensure coverage.xml exists
      - name: Verify coverage.xml exists
        run: test -f coverage.xml

      # 7. Show coverage summary
      - name: Show coverage summary
        run: |
          COVERAGE_PERCENT=$(coverage report | tail -1 | awk '{print $4}')
          echo "Coverage is $COVERAGE_PERCENT"

      # 8. Verify coverage meets threshold
      - name: Verify coverage >= 30%
        uses: VeryGoodOpenSource/very_good_coverage@v2
        with:
          path: coverage.xml
          min_coverage: 80
