name: Run Tests and Coverage

on:
  pull_request:
    branches: [ "main", "merged-tests" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install uv (Python package manager)
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. Install project dependencies
      - name: Install dependencies with uv
        run: uv sync

      # 5. Run only your tests with coverage limited to src/bagels
      - name: Run tests with coverage
        run: |
          uv run pytest \
          --cov=src/bagels/config.py \
          --cov=src/bagels/components/modules/incomemode.py \
          --cov=src/bagels/components/modules/people.py \
          --cov=src/bagels/utils/validation.py \  
          --cov-report=xml:coverage.xml

      # 6. Ensure coverage.xml exists before verification
      - name: Verify coverage.xml exists
        run: test -f coverage.xml

      # 7. Check that coverage meets minimum threshold
      - name: Verify coverage is >= 80%
        uses: VeryGoodOpenSource/very_good_coverage@v2
        with:
          path: coverage.xml
          min_coverage: 80
