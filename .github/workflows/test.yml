name: Run Tests and Coverage

on:
  pull_request:
    branches: [ "main", "merged-tests" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src  # ensures Python can import your bagels package

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install uv (Python package manager)
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. Install project dependencies
      - name: Install dependencies with uv
        run: uv sync

      # 5. Run only selected tests with full bagels coverage
      - name: Run tests with coverage
        run: |
          uv run pytest \
            tests/utils/test_validation.py \
            tests/test_config.py \
            tests/components/modules/test_incomemode.py \
            tests/managers/test_person.py \
            tests/modules/test_people.py \
            --cov=bagels \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-branch

      # 6. Ensure coverage.xml exists
      - name: Verify coverage.xml exists
        run: test -f coverage.xml

      # 7. Check that coverage meets minimum threshold
      - name: Verify coverage is >= 30%
        uses: VeryGoodOpenSource/very_good_coverage@v2
        with:
          path: coverage.xml
          min_coverage: 80
